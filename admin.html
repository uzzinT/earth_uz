<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>earth_uz · 관리자</title>
<link rel="icon" href="img/earth.jpg">
<style>
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  :root { --bg: #0A1430; --card: #13234A; --ink: #E9EEF8; --muted: #9FB0D0; --accent: #F2C46D; --line: #22355F; --danger: #FF8A75; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Paperlogy, system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 120px; }
  h1 { font-weight: 700; font-size: 32px; margin: 0 0 4px; }
  h1 + p { margin: 0 0 24px; color: var(--muted); }
  h1 + p a { color: var(--accent); }
  .panel { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  h2 { font-weight: 700; font-size: 22px; margin: 24px 0 10px; }
  .subj { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: center; margin-bottom: 10px; }
  .subj .pick { padding: 0; width: 96px; aspect-ratio: 4 / 3; overflow: hidden; position: relative; }
  .subj .pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .subj .pick span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #fff; background: #0009; }
  dialog { border: none; border-radius: 18px; padding: 18px; max-width: 720px; width: calc(100% - 32px); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: #0008; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; max-height: 60vh; overflow: auto; }
  .gal button { padding: 0; overflow: hidden; text-align: left; }
  .gal img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .gal span { display: block; font-size: 12px; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gal h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 16px; }
  .upload { cursor: pointer; }
  .paste {
    margin-top: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px;
    font-size: 13px; color: var(--muted); text-align: center; cursor: pointer;
  }
  .paste:focus { outline: none; border-color: var(--accent); color: var(--ink); }
  input[type=text], input[type=url], input[type=password], textarea, select {
    width: 100%; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; padding: 8px 14px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0A1430; font-weight: 700; font-size: 18px; }
  button.danger { color: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .entry { display: grid; grid-template-columns: 160px 1fr; gap: 16px; }
  @media (max-width: 560px) { .entry { grid-template-columns: 1fr; } }
  .preview { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .tools { justify-content: space-between; margin-top: 12px; }
  .apphead { justify-content: space-between; margin: 24px 0 10px; }
  .apphead h2 { margin: 0; }
  .apphead select { width: auto; padding: 8px 10px; }
  /* Each app is a collapsible row: closed shows a mini preview, open shows the full editor. */
  details.panel { padding: 10px 14px; }
  details.panel[open] { padding-bottom: 18px; }
  details.panel > summary { list-style: none; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  details.panel > summary::-webkit-details-marker { display: none; }
  .mini { width: 64px; aspect-ratio: 16 / 9; object-fit: cover; object-position: top; border-radius: 6px; background: var(--bg); flex: none; }
  .sum-title { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum-subj { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .chev { color: var(--accent); font-size: 14px; white-space: nowrap; }
  details[open] .chev::after { content: " 접기"; }
  details:not([open]) .chev::after { content: " 편집"; }
  details[open] > summary { margin-bottom: 12px; }
  /* ≡ drag handle; the row moves only when grabbed here. */
  .handle { cursor: grab; touch-action: none; user-select: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 6px; flex: none; }
  .handle:hover { color: var(--accent); }
  .sortable-ghost { opacity: .35; }
  .sortable-chosen .handle { cursor: grabbing; }
  .group { margin-bottom: 18px; }
  .group-head { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .group-head h3 { margin: 0; font-size: 18px; }
  .group-head .n { color: var(--muted); font-size: 14px; }
  .group-head button { margin-left: auto; padding: 6px 12px; font-size: 14px; }
  .items { min-height: 44px; border-radius: 12px; }
  .items:empty { border: 1px dashed var(--line); }
  .items:empty::before { content: "링크 없음 · ≡를 잡고 여기로 끌어오면 이 과목으로 옮겨져요"; display: block; padding: 12px; color: var(--muted); font-size: 13px; text-align: center; }
  .subj { grid-template-columns: auto 96px 1fr auto; }
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(6px);
    border-top: 2px solid var(--line);
  }
  .savebar .row { max-width: 760px; margin: 0 auto; justify-content: space-between; }
  #msg { color: var(--muted); }
  .pwbox { display: flex; gap: 6px; }
  .pwbox button { padding: 0 8px; display: grid; place-items: center; }
  .pwbox img { width: 28px; height: 28px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>🛠️ 관리자 화면</h1>
  <p>여기서 고친 내용은 <a href="./" target="_blank">보이는 화면</a>에 1~2분 뒤 반영돼요.</p>

  <section class="panel" id="login" hidden>
    <label for="pw">관리자 비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="primary" id="loginBtn">들어가기</button></div>
    <p class="hint"><a href="#" id="resetLink">토큰이 만료됐거나 비밀번호를 바꾸고 싶어요</a></p>
  </section>

  <section class="panel" id="setup" hidden>
    <p style="margin-top:0"><b>처음 설정</b> · GitHub 토큰을 한 번만 넣고 관리자 비밀번호를 정해요.</p>
    <label for="token">GitHub 토큰</label>
    <input type="text" id="token" autocomplete="off" spellcheck="false" placeholder="github_pat_...">
    <label for="newPw">관리자 비밀번호 (8자 이상)</label>
    <input type="password" id="newPw" autocomplete="new-password">
    <p class="hint">토큰은 이 비밀번호로 암호화돼서 저장소에 저장돼요. 비밀번호를 잊으면 토큰을 새로 만들어 여기서 다시 설정하면 돼요.</p>
    <div class="row" style="margin-top:12px"><button class="primary" id="setupBtn">설정하기</button></div>
  </section>

  <div id="editor" hidden>
    <h2>📚 과목</h2>
    <section class="panel">
      <div id="subjList"></div>
      <button id="addSubjBtn" style="margin-top:8px">➕ 과목 추가</button>
    </section>
    <div class="row apphead">
      <h2>🔗 앱</h2>
      <div class="row">
        <select id="filter" aria-label="과목별로 보기"></select>
        <button id="toggleAll">모두 펼치기</button>
        <button class="primary" id="addTopBtn">➕ 새 링크 추가</button>
      </div>
    </div>
    <div id="list"></div>
    <div class="row">
      <button id="addBtn">➕ 새 링크 추가</button>
      <button id="logoutBtn" style="margin-left:auto">로그아웃</button>
    </div>
  </div>
</main>

<div class="savebar" id="savebar" hidden>
  <div class="row">
    <span id="msg"></span>
    <button class="primary" id="saveBtn">💾 저장하기</button>
  </div>
</div>

<dialog id="picker">
  <b>과목 사진 고르기</b>
  <div class="gal" id="gal"></div>
  <div class="row" style="justify-content:space-between">
    <label class="upload"><span>📤 내 사진 올리기</span> <input type="file" accept="image/*" id="pickFile"></label>
    <span class="hint">또는 이 창에서 Ctrl+V로 복사한 사진 붙여넣기</span>
    <button id="pickClose">닫기</button>
  </div>
</dialog>

<template id="entryTpl">
  <details class="panel">
    <summary>
      <span class="handle" title="끌어서 순서 바꾸기" aria-hidden="true">≡</span>
      <img class="mini" alt="">
      <span class="sum-title"></span>
      <span class="sum-subj"></span>
      <span class="chev" aria-hidden="true"></span>
    </summary>
    <div class="entry">
      <div>
        <img class="preview" alt="썸네일 미리보기">
        <label class="upload">
          <span>🖼️ 썸네일 올리기</span>
          <input type="file" accept="image/*">
        </label>
        <div class="paste" tabindex="0" role="button" aria-label="클립보드 사진 붙여넣기">📋 여기를 누르고 Ctrl+V<br>(복사한 사진 붙여넣기)</div>
        <p class="hint">안 올리면 사이트 첫 화면이 자동으로 들어가요.</p>
        <button class="clearThumb" hidden>썸네일 지우기</button>
      </div>
      <div>
        <label>과목</label>
        <select data-k="subject"></select>
        <label>제목</label>
        <input type="text" data-k="title" required>
        <label>설명</label>
        <textarea data-k="desc"></textarea>
        <label>링크 주소</label>
        <input type="url" data-k="url" placeholder="https://..." required>
      </div>
    </div>
    <div class="row tools">
      <div class="row">
        <button class="up" aria-label="위로">⬆️</button>
        <button class="down" aria-label="아래로">⬇️</button>
      </div>
      <button class="danger del">🗑️ 삭제</button>
    </div>
  </details>
</template>

<script src="vendor/Sortable.min.js?v=1.15.2"></script>
<script src="gallery.js?v=20261020"></script>
<script src="common.js?v=20261019"></script>
<script>
const REPO = "uzzinT/earth_uz";
const $ = id => document.getElementById(id);
let token = "";
let apps = [], subjects = [];
let sha = "";
const localPreviews = new Map(); // thumb path → blob URL, until Pages rebuilds with the uploaded file

// Token lives only for this tab session; the password unlocks it again next time.
function store(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }
function load(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } }

const bytesToB64 = bytes => { let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); };
const b64ToBytes = b64 => Uint8Array.from(atob(b64.replace(/\n/g, "")), c => c.charCodeAt(0));
// GitHub's contents API speaks base64; go through bytes so Korean text survives.
const toB64 = text => bytesToB64(new TextEncoder().encode(text));
const fromB64 = b64 => new TextDecoder().decode(b64ToBytes(b64));
console.assert(fromB64(toB64("수업 앱 🌏")) === "수업 앱 🌏", "base64 roundtrip");

// auth.json is public, so the token in it is AES-GCM encrypted with a key stretched from the password.
const ITER = 600000;
async function passwordKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptToken(tok, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await passwordKey(pw, salt, ITER), new TextEncoder().encode(tok));
  return { iter: ITER, salt: bytesToB64(salt), iv: bytesToB64(iv), data: bytesToB64(new Uint8Array(data)) };
}
async function decryptToken(auth, pw) { // throws on a wrong password
  const key = await passwordKey(pw, b64ToBytes(auth.salt), auth.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(auth.iv) }, key, b64ToBytes(auth.data)));
}

async function gh(path, opts = {}) {
  const res = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json" },
  });
  if (!res.ok) throw Object.assign(new Error(res.status + " " + (await res.text())), { status: res.status });
  return res.json();
}

function say(text) { $("msg").textContent = text; }

function show(id) { for (const s of ["login", "setup", "editor", "savebar"]) $(s).hidden = !(s === id || (id === "editor" && s === "savebar")); }

// Loads links.json with the token; returns false (after telling the user) if the token doesn't work.
async function openEditor(tok) {
  token = tok;
  try {
    const file = await gh("links.json");
    sha = file.sha;
    ({ subjects, apps } = normalize(JSON.parse(fromB64(file.content))));
  } catch (e) {
    token = "";
    store("gh_token", null);
    alert(e.status === 401 || e.status === 403 || e.status === 404
      ? "토큰이 만료됐거나 이 저장소 권한이 없어요. 새 토큰으로 다시 설정해 주세요."
      : "불러오지 못했어요: " + e.message);
    return false;
  }
  store("gh_token", token);
  show("editor");
  render();
  say("불러왔어요.");
  return true;
}

async function login() {
  const pw = $("pw").value;
  if (!pw) return;
  $("loginBtn").disabled = true;
  try {
    const auth = await fetch("auth.json", { cache: "no-cache" }).then(r => r.json());
    let tok;
    try { tok = await decryptToken(auth, pw); }
    catch { return alert("비밀번호가 틀렸어요."); }
    if (!(await openEditor(tok))) show("setup");
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function setup() {
  const tok = $("token").value.trim(), pw = $("newPw").value;
  if (!tok) return alert("GitHub 토큰을 넣어 주세요.");
  if (pw.length < 8) return alert("비밀번호는 8자 이상으로 정해 주세요.");
  $("setupBtn").disabled = true;
  try {
    if (!(await openEditor(tok))) return show("setup");
    const body = { message: "Set admin password", content: toB64(JSON.stringify(await encryptToken(tok, pw)) + "\n") };
    try { body.sha = (await gh("auth.json")).sha; } catch (e) { if (e.status !== 404) throw e; }
    await gh("auth.json", { method: "PUT", body: JSON.stringify(body) });
    say("✅ 비밀번호를 설정했어요. 1~2분 뒤부터 다른 기기에서도 비밀번호로 들어올 수 있어요.");
  } catch (e) {
    alert("비밀번호를 저장하지 못했어요: " + e.message);
  } finally {
    $("setupBtn").disabled = false;
    $("token").value = $("newPw").value = "";
  }
}

const openApps = new WeakSet(); // which app editors are expanded, kept across re-renders
const subjectName = id => subjects.find(s => s.id === id)?.name || "기타";

function renderFilter() {
  const f = $("filter"), keep = f.options.length ? f.value : "*"; // first render: show everything
  f.replaceChildren(new Option("전체 과목", "*"), ...[{ id: "", name: "기타" }, ...subjects].map(s => new Option(s.name || "이름 없음", s.id)));
  f.value = [...f.options].some(o => o.value === keep) ? keep : "*";
}

const entryEls = new Map(); // app → its editor element, for scrolling to it
// Apps whose subject no longer exists are shown (and saved) under 기타.
const groupOf = app => subjects.some(s => s.id === app.subject) ? app.subject : "";

function addApp(subject) {
  if (typeof subject !== "string") subject = $("filter").value === "*" ? "" : $("filter").value; // new link starts in the subject being viewed
  const app = { title: "", desc: "", url: "", thumb: "", subject };
  apps.unshift(app); // first in the global order = top of its subject group
  openApps.add(app);
  render();
  dirty();
  const el = entryEls.get(app);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.querySelector("[data-k=title]").focus({ preventScroll: true });
}

// After a drag, read the new order (and any subject change) back from the DOM.
function syncFromDom() {
  const byEl = new Map([...entryEls].map(([app, el]) => [el, app]));
  const order = [];
  document.querySelectorAll("#list .items").forEach(box => {
    for (const el of box.children) {
      const app = byEl.get(el);
      app.subject = box.dataset.subject;
      order.push(app);
    }
  });
  apps = order;
  render();
  dirty();
}

// ⬆️⬇️ move an app past its neighbour in the same subject.
function moveApp(app, d) {
  const same = apps.filter(a => groupOf(a) === groupOf(app));
  const other = same[same.indexOf(app) + d];
  if (!other) return;
  const i = apps.indexOf(app), j = apps.indexOf(other);
  [apps[i], apps[j]] = [apps[j], apps[i]];
  render();
  dirty();
}

function render() {
  renderSubjects();
  renderFilter();
  const filter = $("filter").value;
  entryEls.clear();
  const groups = [...subjects.map(s => ({ id: s.id, name: s.name || "이름 없음" })), { id: "", name: "기타 (분류 없음)" }];
  $("list").replaceChildren(...groups.map(g => {
    const mine = apps.filter(a => groupOf(a) === g.id);
    const sec = document.createElement("section");
    sec.className = "group";
    sec.hidden = filter !== "*" && filter !== g.id;
    const head = document.createElement("div");
    head.className = "group-head";
    head.append(Object.assign(document.createElement("h3"), { textContent: g.name }),
      Object.assign(document.createElement("span"), { className: "n", textContent: mine.length + "개" }),
      Object.assign(document.createElement("button"), { textContent: "➕ 이 과목에 추가", onclick: () => addApp(g.id) }));
    const box = document.createElement("div");
    box.className = "items";
    box.dataset.subject = g.id;
    box.append(...mine.map(entry));
    new Sortable(box, { group: "apps", handle: ".handle", animation: 150, onEnd: syncFromDom });
    sec.append(head, box);
    return sec;
  }));
}

function entry(app) {
  const el = $("entryTpl").content.firstElementChild.cloneNode(true);
  entryEls.set(app, el);
  el.open = openApps.has(app);
  el.addEventListener("toggle", () => { el.open ? openApps.add(app) : openApps.delete(app); });
  el.querySelector(".handle").addEventListener("click", e => e.preventDefault()); // grabbing the handle shouldn't toggle the row
  const sumTitle = el.querySelector(".sum-title"), sumSubj = el.querySelector(".sum-subj");
  const showSummary = () => { sumTitle.textContent = app.title || "새 링크 (제목 없음)"; sumSubj.textContent = subjectName(app.subject); };
  showSummary();
  el.querySelector("select").append(...[{ id: "", name: "기타 (분류 없음)" }, ...subjects]
    .map(s => new Option(s.name || "이름 없음", s.id)));
  el.querySelector("select").addEventListener("change", render); // move the row into its new subject group
  const img = el.querySelector(".preview");
  const showThumb = () => {
    const src = localPreviews.get(app.thumb) || thumbSrc(app);
    for (const im of [img, el.querySelector(".mini")]) {
      im.style.visibility = src ? "" : "hidden"; // no address yet: avoid a broken-image icon
      if (src) im.src = src;
    }
    el.querySelector(".clearThumb").hidden = !app.thumb;
  };
  showThumb();

  el.querySelectorAll("[data-k]").forEach(input => {
    input.value = (input.dataset.k === "subject" ? groupOf(app) : app[input.dataset.k]) || "";
    input.addEventListener("input", () => { app[input.dataset.k] = input.value; showSummary(); say("저장 안 된 변경이 있어요."); });
    if (input.dataset.k === "url") input.addEventListener("change", showThumb);
  });

  el.querySelector("input[type=file]").addEventListener("change", e => uploadImage(e.target.files[0], app, "thumb", showThumb));
  // Ctrl+V anywhere in this link's editor uploads a copied image as its thumbnail.
  el.addEventListener("paste", e => { const f = pastedImage(e); if (f) { e.preventDefault(); uploadImage(f, app, "thumb", showThumb); } });
  const zone = el.querySelector(".paste");
  zone.onclick = async () => {
    zone.focus(); // Ctrl+V works once focused; also try reading the clipboard directly
    const f = await readClipboardImage();
    if (f) uploadImage(f, app, "thumb", showThumb);
  };
  el.querySelector(".clearThumb").onclick = () => { app.thumb = ""; showThumb(); say("저장 안 된 변경이 있어요."); };
  el.querySelector(".up").onclick = () => moveApp(app, -1);
  el.querySelector(".down").onclick = () => moveApp(app, 1);
  el.querySelector(".del").onclick = () => {
    if (!confirm("'" + (app.title || "제목 없음") + "'을(를) 삭제할까요?")) return;
    apps.splice(apps.indexOf(app), 1); render(); say("저장 안 된 변경이 있어요.");
  };
  return el;
}

function move(arr, i, d) {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  render();
  dirty();
}

const dirty = () => say("저장 안 된 변경이 있어요.");

function renderSubjects() {
  $("subjList").replaceChildren(...subjects.map((s, i) => {
    const row = document.createElement("div");
    row.className = "subj";
    row.append(Object.assign(document.createElement("span"), { className: "handle", title: "끌어서 순서 바꾸기", textContent: "≡" }));
    const pick = Object.assign(document.createElement("button"), { className: "pick", title: "사진 바꾸기", onclick: () => openPicker(s) });
    pick.append(Object.assign(document.createElement("img"), { src: localPreviews.get(s.image) || subjectImage(s, i), alt: "" }),
      Object.assign(document.createElement("span"), { textContent: "사진 바꾸기" }));
    const name = Object.assign(document.createElement("input"), { type: "text", value: s.name, placeholder: "과목 이름", ariaLabel: "과목 이름" });
    name.oninput = () => { s.name = name.value; dirty(); };
    name.onchange = render; // refresh the subject dropdowns on the app cards
    const tools = document.createElement("div");
    tools.className = "row";
    const btn = (text, label, fn) => Object.assign(document.createElement("button"), { textContent: text, ariaLabel: label, onclick: fn });
    tools.append(
      btn("⬆️", "위로", () => move(subjects, i, -1)),
      btn("⬇️", "아래로", () => move(subjects, i, 1)),
      Object.assign(btn("🗑️", "과목 삭제", () => {
        const n = apps.filter(a => a.subject === s.id).length;
        if (!confirm("'" + (s.name || "이름 없음") + "' 과목을 삭제할까요?" + (n ? "\n이 과목의 앱 " + n + "개는 '기타'로 옮겨져요." : ""))) return;
        apps.forEach(a => { if (a.subject === s.id) a.subject = ""; });
        subjects.splice(i, 1);
        render();
        dirty();
      }), { className: "danger" }),
    );
    row.append(pick, name, tools);
    return row;
  }));
  subjectSortable ||= new Sortable($("subjList"), {
    handle: ".handle", animation: 150,
    onEnd: e => { subjects.splice(e.newIndex, 0, ...subjects.splice(e.oldIndex, 1)); render(); dirty(); },
  });
}
let subjectSortable = null;

let picking = null; // subject whose photo the picker is choosing
function openPicker(s) {
  picking = s;
  $("gal").replaceChildren(...GALLERY.flatMap((g, i) => {
    const b = Object.assign(document.createElement("button"), { title: g.name, onclick: () => { s.image = g.src; $("picker").close(); render(); dirty(); } });
    b.append(Object.assign(document.createElement("img"), { src: g.src, alt: "", loading: "lazy" }), Object.assign(document.createElement("span"), { textContent: g.name }));
    const isNewGroup = i === 0 || GALLERY[i - 1].group !== g.group;
    return isNewGroup ? [Object.assign(document.createElement("h3"), { textContent: g.group }), b] : [b];
  }));
  $("picker").showModal();
}

const pastedImage = e => [...(e.clipboardData?.items || [])].find(i => i.kind === "file" && i.type.startsWith("image/"))?.getAsFile() || null;

// Click path: read an image straight from the clipboard (Chrome/Edge ask permission once).
async function readClipboardImage() {
  try {
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find(t => t.startsWith("image/"));
      if (type) return await item.getType(type);
    }
    say("클립보드에 사진이 없어요. 사진을 복사한 뒤 Ctrl+V를 눌러 주세요.");
  } catch {
    say("이 칸을 누른 상태에서 Ctrl+V를 눌러 주세요.");
  }
  return null;
}

// Screenshots are often large PNGs: shrink to at most 1200px wide JPEG before committing.
async function shrink(blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const w = Math.min(1200, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const c = Object.assign(document.createElement("canvas"), { width: w, height: h });
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); // transparent PNGs get a white background
    g.drawImage(bmp, 0, 0, w, h);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)) || blob;
  } catch {
    return blob;
  }
}

// Uploads an image (file or pasted blob) to thumbs/ and stores its path in obj[key].
async function uploadImage(file, obj, key, done) {
  if (!file) return;
  say("사진 올리는 중...");
  file = await shrink(file);
  if (file.size > 5 * 1024 * 1024) return alert("5MB보다 작은 이미지를 골라 주세요.");
  const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(",")[1]); fr.readAsDataURL(file); });
  const ext = file.type === "image/jpeg" ? ".jpg" : "." + (file.type.split("/")[1] || "png");
  const path = "thumbs/" + Date.now() + ext;
  try {
    await gh(path, { method: "PUT", body: JSON.stringify({ message: "Add thumbnail", content: b64 }) });
  } catch (e) {
    return say("사진을 올리지 못했어요: " + e.message);
  }
  localPreviews.set(path, URL.createObjectURL(file));
  obj[key] = path;
  done();
  say("사진을 올렸어요. '저장하기'를 눌러야 반영돼요.");
}

async function save() {
  if (subjects.some(s => !s.name.trim())) return alert("이름이 비어 있는 과목이 있어요.");
  // Open and show the first bad entry, since it may be collapsed or filtered out.
  const reveal = (a, msg) => {
    openApps.add(a);
    $("filter").value = "*";
    render();
    entryEls.get(a).scrollIntoView({ block: "center" });
    alert(msg);
  };
  for (const a of apps) {
    if (!a.title?.trim()) return reveal(a, "제목이 비어 있는 링크가 있어요.");
    if (!/^https?:\/\/\S+$/.test(a.url?.trim() || "")) return reveal(a, "'" + a.title + "'의 링크 주소는 https:// 로 시작해야 해요.");
  }
  say("저장하는 중...");
  $("saveBtn").disabled = true;
  try {
    const res = await gh("links.json", {
      method: "PUT",
      body: JSON.stringify({ message: "Update links", content: toB64(JSON.stringify({ subjects, apps }, null, 2) + "\n"), sha }),
    });
    sha = res.content.sha;
    say("✅ 저장됐어요! 1~2분 뒤 사이트에 반영돼요.");
  } catch (e) {
    say(e.status === 409
      ? "다른 곳에서 먼저 수정됐어요. 새로고침한 뒤 다시 고쳐 주세요."
      : "저장하지 못했어요: " + e.message);
  } finally {
    $("saveBtn").disabled = false;
  }
}

// Monkey button (Fluent 3D, MIT) next to each password box toggles showing the text.
document.querySelectorAll("input[type=password]").forEach(input => {
  const box = Object.assign(document.createElement("div"), { className: "pwbox" });
  const eye = Object.assign(document.createElement("button"), { type: "button", ariaLabel: "비밀번호 보기" });
  const face = Object.assign(document.createElement("img"), { src: "img/monkey-hide.png", alt: "" });
  eye.append(face);
  eye.setAttribute("aria-pressed", "false");
  eye.onclick = () => {
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    face.src = show ? "img/monkey-see.png" : "img/monkey-hide.png";
    eye.setAttribute("aria-pressed", show);
  };
  input.replaceWith(box);
  box.append(input, eye);
});

$("loginBtn").onclick = login;
$("pw").addEventListener("keydown", e => e.key === "Enter" && login());
$("setupBtn").onclick = setup;
$("resetLink").onclick = e => { e.preventDefault(); show("setup"); };
$("addSubjBtn").onclick = () => {
  // New subjects start with a NASA photo no other subject uses yet.
  const free = GALLERY.find(g => !subjects.some(s => s.image === g.src)) || GALLERY[0];
  subjects.push({ id: Date.now().toString(36), name: "", image: free.src });
  render();
  dirty();
};
$("pickClose").onclick = () => $("picker").close();
$("picker").addEventListener("paste", e => {
  const f = pastedImage(e), s = picking;
  if (!f) return;
  e.preventDefault();
  $("picker").close();
  uploadImage(f, s, "image", render);
});
$("pickFile").addEventListener("change", e => {
  const s = picking;
  $("picker").close();
  uploadImage(e.target.files[0], s, "image", render);
  e.target.value = "";
});
$("addBtn").onclick = $("addTopBtn").onclick = () => addApp();
$("filter").onchange = render;
$("toggleAll").onclick = () => {
  const visible = [...document.querySelectorAll("#list .group:not([hidden]) details")];
  const open = visible.some(d => !d.open); // open all unless everything shown is already open
  visible.forEach(d => d.open = open);
  $("toggleAll").textContent = open ? "모두 접기" : "모두 펼치기";
};
$("saveBtn").onclick = save;
$("logoutBtn").onclick = () => { store("gh_token", null); location.reload(); };
addEventListener("beforeunload", e => { if ($("msg").textContent.includes("저장 안 된")) e.preventDefault(); });

if (load("gh_token")) openEditor(load("gh_token"));
else fetch("auth.json", { cache: "no-cache" }).then(r => show(r.ok ? "login" : "setup"), () => show("setup"));
</script>
