<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earth_uz · 수업자료 모음</title>
<link rel="icon" href="img/earth.jpg">
<style>
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  :root {
    --bg: #eef6f1;
    --card: #ffffff;
    --ink: #1f3b2f;
    --muted: #5c7468;
    --accent: #2f9e6e;
    --sky: #4a90d9;
    --line: #d5e6dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1d18;
      --card: #172a23;
      --ink: #e4f2ea;
      --muted: #9db8aa;
      --accent: #5fd39d;
      --sky: #7db7f0;
      --line: #27443a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Paperlogy, system-ui, sans-serif;
    line-height: 1.6;
  }
  /* Night-sky header: a few CSS "stars" over a deep blue gradient. */
  header {
    text-align: center;
    padding: 18px 16px 16px;
    margin-bottom: 20px;
    color: #f4f8ff;
    background:
      radial-gradient(1px 1px at 12% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 28% 70%, #fff, transparent),
      radial-gradient(1px 1px at 45% 18%, #cfe3ff, transparent),
      radial-gradient(1.5px 1.5px at 63% 55%, #fff, transparent),
      radial-gradient(1px 1px at 78% 25%, #fff, transparent),
      radial-gradient(1px 1px at 88% 75%, #cfe3ff, transparent),
      radial-gradient(1px 1px at 6% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 94% 45%, #fff, transparent),
      linear-gradient(180deg, #050b1f, #10264a 70%, #1c3f63);
  }
  .globe {
    width: 44px; height: 44px; border-radius: 50%; display: inline-block;
    background: url(img/earth.jpg) center / 150% no-repeat; /* zoom past the black space around Earth */
    box-shadow: 0 0 24px #6fb4ff66; animation: spin 90s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .globe { animation: none; } }
  h1 { font-weight: 800; letter-spacing: -0.02em; font-size: clamp(26px, 5vw, 34px); margin: 0 0 0 8px; line-height: 1.2; display: inline-block; vertical-align: middle; }
  .globe { vertical-align: middle; }
  /* Subject picker (home) gets the big header; inside a subject it stays compact. */
  body.home header { padding: 48px 16px 36px; }
  body.home .globe { width: 132px; height: 132px; box-shadow: 0 0 60px #6fb4ff88; }
  body.home h1 { display: block; font-size: clamp(32px, 6vw, 48px); margin: 8px 0 4px; }
  header p { margin: 0; color: #b9cbe6; }
  main { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }
  input[type=search] {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    margin-bottom: 18px;
  }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  a.card {
    display: flex; flex-direction: column;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 20%, transparent);
    outline: none;
  }
  .thumb {
    width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top;
    background: color-mix(in srgb, var(--sky) 12%, var(--card));
    border-bottom: 2px solid var(--line);
    display: block;
  }
  .body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
  .name { font-weight: 700; font-size: 20px; }
  .desc { color: var(--muted); font-size: 15px; }
  a.subj { position: relative; aspect-ratio: 4 / 3; border: none; background: #0b1530; }
  a.subj img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  a.subj:hover img, a.subj:focus-visible img { transform: scale(1.06); }
  a.subj .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px 14px;
    background: linear-gradient(transparent, #000c); color: #fff;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 8px;
  }
  a.subj .name { font-size: 24px; text-shadow: 0 2px 8px #0008; }
  a.subj .count { font-size: 14px; opacity: .85; white-space: nowrap; }
  .crumb { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .crumb a {
    color: var(--accent); text-decoration: none; padding: 6px 14px;
    border: 2px solid var(--line); border-radius: 999px; background: var(--card); white-space: nowrap;
  }
  .crumb a:hover, .crumb a:focus-visible { border-color: var(--accent); outline: none; }
  .crumb h2 { font-weight: 700; font-size: 26px; margin: 0; }
  [hidden] { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 32px; }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 32px; }
  footer .credit { color: inherit; }
  footer .admin { text-decoration: none; opacity: .35; margin-left: 6px; }
  footer .admin:hover, footer .admin:focus-visible { opacity: 1; }
</style>
</head>
<body class="home">
<header>
  <div class="globe" aria-hidden="true"></div>
  <h1>earth_uz</h1>
  <p>수업자료 웹앱 모음</p>
</header>

<main>
  <input type="search" id="q" placeholder="🔍 앱 이름이나 설명으로 찾기" aria-label="앱 검색">
  <div class="crumb" id="crumb" hidden><a href="#">← 전체 과목</a><h2 id="subjTitle"></h2></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>찾는 앱이 없어요 🥲</p>
</main>

<footer>made by @earth._.uz · <a class="credit" href="credits.html">사진 출처</a> <a class="admin" href="admin.html" aria-label="관리자 모드" title="관리자 모드">⚙️</a></footer>

<script src="gallery.js"></script>
<script src="common.js"></script>
<script>
let apps = [], subjects = [];
const OTHER = { id: "_other", name: "기타", image: "img/moon.jpg" };
const $ = id => document.getElementById(id);
const grid = $("grid");
const empty = $("empty");

// Apps whose subject was deleted or never set land in "기타".
const subjectOf = a => subjects.some(s => s.id === a.subject) ? a.subject : OTHER.id;

function span(cls, text) {
  const el = document.createElement("span");
  el.className = cls;
  el.textContent = text;
  return el;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const current = [...subjects, OTHER].find(s => s.id === decodeURIComponent(location.hash.slice(1)));
  $("crumb").hidden = !current;
  document.body.classList.toggle("home", !current);
  if (current) $("subjTitle").textContent = current.name;

  if (!current && !q) {
    const list = [...subjects, OTHER]
      .map(s => ({ s, n: apps.filter(a => subjectOf(a) === s.id).length }))
      .filter(({ s, n }) => s !== OTHER || n > 0);
    grid.replaceChildren(...list.map(({ s, n }, i) => {
      const card = document.createElement("a");
      card.className = "card subj";
      card.href = "#" + encodeURIComponent(s.id);
      const img = Object.assign(document.createElement("img"), { src: subjectImage(s, i), alt: "", loading: "lazy" });
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.append(span("name", s.name), span("count", "앱 " + n + "개"));
      card.append(img, cap);
      return card;
    }));
    empty.textContent = "아직 과목이 없어요.";
    empty.hidden = list.length > 0;
    return;
  }

  const shown = apps.filter(a => (!current || subjectOf(a) === current.id) && (a.title + " " + a.desc).toLowerCase().includes(q));
  grid.replaceChildren(...shown.map(a => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = safeUrl(a.url) || "#";
    card.target = "_blank";
    card.rel = "noopener";

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = thumbSrc(a);
    img.alt = "";
    img.loading = "lazy";

    const body = document.createElement("div");
    body.className = "body";
    body.append(span("name", a.title), span("desc", a.desc || ""));

    card.append(img, body);
    return card;
  }));
  empty.textContent = q ? "찾는 앱이 없어요 🥲" : "이 과목에는 아직 앱이 없어요.";
  empty.hidden = shown.length > 0;
}

$("q").addEventListener("input", render);
addEventListener("hashchange", () => { $("q").value = ""; render(); scrollTo(0, 0); });

fetch("links.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => { ({ subjects, apps } = normalize(data)); render(); })
  .catch(() => { empty.textContent = "목록을 불러오지 못했어요. 새로고침해 주세요."; empty.hidden = false; });
</script>
</body>
</html>
