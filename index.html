<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earth_uz · 수업자료 모음</title>
<link rel="icon" href="img/earth.jpg">
<style>
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: Paperlogy; src: url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2) format("woff2"); font-weight: 800; font-display: swap; }
  /* Observatory look: deep night navy, starlight text, one warm accent (sunlight on Earth's rim). */
  :root {
    --bg: #0A1430;
    --card: #13234A;
    --ink: #E9EEF8;
    --muted: #9FB0D0;
    --accent: #F2C46D;
    --line: #22355F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Paperlogy, system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header { position: relative; overflow: hidden; }
  header .wrap { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding-top: 16px; padding-bottom: 14px; }
  .hero-img { display: none; }
  h1 { font-weight: 800; letter-spacing: -0.04em; line-height: .95; margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .globe {
    flex: none; width: 44px; aspect-ratio: 1; border-radius: 50%;
    background: url(img/earth.jpg) center / 150% no-repeat; /* zoom past the black space around Earth */
    box-shadow: 0 0 18px #6fb4ff55; animation: spin 90s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .globe { animation: none; } }
  /* Subject picker (home): full-bleed photo of Earth's horizon with a huge wordmark. */
  body.home header { min-height: clamp(300px, 52vh, 560px); display: flex; align-items: flex-end; }
  body.home .hero-img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  body.home header::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--bg)); }
  body.home header .wrap { width: 100%; padding-bottom: 28px; }
  body.home .globe { display: none; }
  body.home h1 { font-size: clamp(56px, 13vw, 128px); }
  body.home header p { font-size: clamp(16px, 2.4vw, 20px); margin-top: 12px; }
  main.wrap { padding-top: 8px; padding-bottom: 64px; }
  input[type=search] {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    margin-bottom: 22px;
  }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .grid { display: grid; gap: 14px; }
  .grid.apps { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .grid.strips { gap: 10px; }
  /* Subject strip: wide photo band so a phone shows several subjects at once. */
  .strip {
    position: relative; height: clamp(96px, 17vw, 160px); border-radius: 14px; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 24px;
    color: inherit; text-decoration: none; background: var(--card);
  }
  .strip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .strip::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, #0A1430e6 10%, #0A143033 70%); }
  .strip .name, .strip .count { position: relative; z-index: 2; }
  .strip .name { font-size: clamp(22px, 4vw, 34px); font-weight: 800; letter-spacing: -0.02em; }
  .strip .count { color: var(--accent); font-size: 15px; white-space: nowrap; }
  .strip:hover img, .strip:focus-visible img { transform: scale(1.04); }
  .strip:hover, .strip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card {
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    color: inherit;
  }
  .card:hover, .card:focus-within { border-color: var(--accent); }
  .thumb {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: top;
    background: var(--bg);
    display: block;
  }
  .body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 4px; }
  .name { font-weight: 700; font-size: 19px; }
  .desc { color: var(--muted); font-size: 15px; }
  .app .cover { display: block; }
  .app { position: relative; }
  .app .text { display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; outline: none; }
  /* QR sits on the thumbnail's top-right corner so the description keeps the full width. */
  .qr {
    position: absolute; top: 10px; right: 10px; width: 64px; height: 64px; padding: 3px; cursor: zoom-in;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 12px #0004;
  }
  .qr:hover, .qr:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); }
  .qr svg, #qrBigCode svg { width: 100%; height: 100%; display: block; }
  #qrBig { border: none; border-radius: 24px; padding: 24px; text-align: center; max-width: min(92vw, 520px); background: #fff; color: #0A1430; }
  #qrBig::backdrop { background: #000b; }
  #qrBigCode { width: min(76vw, 440px); aspect-ratio: 1; margin: 0 auto 12px; }
  #qrBigTitle { display: block; font-size: 22px; }
  #qrBigUrl { display: block; color: #4A5A7A; word-break: break-all; margin: 4px 0 14px; }
  #qrBig button { font: inherit; padding: 8px 22px; border-radius: 999px; border: 1px solid #c8d2e6; background: #fff; color: #0A1430; cursor: pointer; }
  .crumb { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .crumb a {
    color: var(--accent); text-decoration: none; padding: 6px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); white-space: nowrap;
  }
  .crumb a:hover, .crumb a:focus-visible { border-color: var(--accent); outline: none; }
  .crumb h2 { font-weight: 800; letter-spacing: -0.02em; font-size: 26px; margin: 0; }
  [hidden] { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 32px; }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 32px; }
  footer .credit { color: inherit; }
  footer .admin { text-decoration: none; opacity: .35; margin-left: 6px; }
  footer .admin:hover, footer .admin:focus-visible { opacity: 1; }
</style>
</head>
<body class="home">
<header>
  <img class="hero-img" src="img/nasa/iss040e080833.jpg" alt="">
  <div class="wrap">
    <div class="globe" aria-hidden="true"></div>
    <div>
      <h1>earth_uz</h1>
      <p>지구와 우주를 배우는 수업 앱 모음</p>
    </div>
  </div>
</header>

<main class="wrap">
  <input type="search" id="q" placeholder="앱 이름이나 설명으로 찾기" aria-label="앱 검색">
  <div class="crumb" id="crumb" hidden><a href="#">← 전체 과목</a><h2 id="subjTitle"></h2></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>찾는 앱이 없어요 🥲</p>
</main>

<dialog id="qrBig" aria-label="QR 코드 크게 보기">
  <div id="qrBigCode"></div>
  <b id="qrBigTitle"></b>
  <small id="qrBigUrl"></small>
  <button id="qrClose">닫기</button>
</dialog>

<footer>made by @earth._.uz · <a class="credit" href="credits.html">사진 출처</a> <a class="admin" href="admin.html" aria-label="관리자 모드" title="관리자 모드">⚙️</a></footer>

<script src="vendor/qrcode.js?v=1.4.4"></script>
<script src="gallery.js?v=20261020"></script>
<script src="common.js?v=20261019"></script>
<script>
let apps = [], subjects = [];
const OTHER = { id: "_other", name: "기타", image: "img/moon.jpg" };
const $ = id => document.getElementById(id);
const grid = $("grid");
const empty = $("empty");

// Apps whose subject was deleted or never set land in "기타".
const subjectOf = a => subjects.some(s => s.id === a.subject) ? a.subject : OTHER.id;

function span(cls, text) {
  const el = document.createElement("span");
  el.className = cls;
  el.textContent = text;
  return el;
}

qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"]; // keep non-ASCII URLs intact
function qrSvg(url) {
  const q = qrcode(0, "M");
  q.addData(url);
  q.make();
  return q.createSvgTag({ scalable: true, margin: 2 });
}

function showQr(a, url) {
  $("qrBigCode").innerHTML = qrSvg(url);
  $("qrBigTitle").textContent = a.title;
  $("qrBigUrl").textContent = url;
  $("qrBig").showModal();
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const current = [...subjects, OTHER].find(s => s.id === decodeURIComponent(location.hash.slice(1)));
  $("crumb").hidden = !current;
  document.body.classList.toggle("home", !current);
  if (current) $("subjTitle").textContent = current.name;

  grid.className = "grid " + (!current && !q ? "strips" : "apps");
  if (!current && !q) {
    const list = [...subjects, OTHER]
      .map(s => ({ s, n: apps.filter(a => subjectOf(a) === s.id).length }))
      .filter(({ s, n }) => s !== OTHER || n > 0);
    grid.replaceChildren(...list.map(({ s, n }, i) => {
      const card = document.createElement("a");
      card.className = "strip";
      card.href = "#" + encodeURIComponent(s.id);
      const img = Object.assign(document.createElement("img"), { src: subjectImage(s, i), alt: "" });
      card.append(img, span("name", s.name), span("count", "앱 " + n + "개"));
      return card;
    }));
    empty.textContent = "아직 과목이 없어요.";
    empty.hidden = list.length > 0;
    return;
  }

  const shown = apps.filter(a => (!current || subjectOf(a) === current.id) && (a.title + " " + a.desc).toLowerCase().includes(q));
  grid.replaceChildren(...shown.map(a => {
    const url = safeUrl(a.url);
    const link = cls => Object.assign(document.createElement("a"), { className: cls, href: url || "#", target: "_blank", rel: "noopener" });
    const card = document.createElement("div");
    card.className = "card app";
    const cover = link("cover");
    cover.tabIndex = -1; // the title link below is the keyboard stop

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = thumbSrc(a);
    img.alt = "";
    img.loading = "lazy";

    const body = document.createElement("div");
    body.className = "body";
    const text = link("text");
    text.append(span("name", a.title), span("desc", a.desc || ""));
    body.append(text);
    let qr;
    if (url) {
      qr = Object.assign(document.createElement("button"), { className: "qr", title: "QR 크게 보기", onclick: () => showQr(a, url) });
      qr.setAttribute("aria-label", a.title + " QR 코드 크게 보기");
      qr.innerHTML = qrSvg(url);
    }

    cover.append(img);
    card.append(cover, body);
    if (url) card.append(qr);
    return card;
  }));
  empty.textContent = q ? "찾는 앱이 없어요 🥲" : "이 과목에는 아직 앱이 없어요.";
  empty.hidden = shown.length > 0;
}

$("q").addEventListener("input", render);
$("qrClose").onclick = () => $("qrBig").close();
$("qrBig").addEventListener("click", e => { if (e.target === $("qrBig")) $("qrBig").close(); }); // backdrop click
addEventListener("hashchange", () => { $("q").value = ""; render(); scrollTo(0, 0); });

fetch("links.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => { ({ subjects, apps } = normalize(data)); render(); })
  .catch(e => { console.error(e); empty.textContent = "목록을 불러오지 못했어요. 새로고침(Ctrl+F5)해 주세요."; empty.hidden = false; });
</script>
</body>
</html>
