<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>earth_uz · 수업자료 모음</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef6f1;
    --card: #ffffff;
    --ink: #1f3b2f;
    --muted: #5c7468;
    --accent: #2f9e6e;
    --sky: #4a90d9;
    --line: #d5e6dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1d18;
      --card: #172a23;
      --ink: #e4f2ea;
      --muted: #9db8aa;
      --accent: #5fd39d;
      --sky: #7db7f0;
      --line: #27443a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 56px 16px 32px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--sky) 18%, transparent), transparent);
  }
  .globe { font-size: 64px; display: inline-block; animation: spin 12s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .globe { animation: none; } }
  h1 { font-family: "Jua", sans-serif; font-size: clamp(32px, 6vw, 48px); margin: 8px 0 4px; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1040px; margin: 0 auto; padding: 0 16px 64px; }
  input[type=search] {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    margin-bottom: 24px;
  }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  a.card {
    display: flex; flex-direction: column;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 20%, transparent);
    outline: none;
  }
  .thumb {
    width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top;
    background: color-mix(in srgb, var(--sky) 12%, var(--card));
    border-bottom: 2px solid var(--line);
    display: block;
  }
  .body { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
  .name { font-family: "Jua", sans-serif; font-size: 20px; }
  .desc { color: var(--muted); font-size: 15px; }
  .empty { text-align: center; color: var(--muted); padding: 32px; }
  footer { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 32px; }
  footer .admin { text-decoration: none; opacity: .35; margin-left: 6px; }
  footer .admin:hover, footer .admin:focus-visible { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="globe" aria-hidden="true">🌏</div>
  <h1>earth_uz</h1>
  <p>수업자료 웹앱 모음</p>
</header>

<main>
  <input type="search" id="q" placeholder="🔍 앱 이름이나 설명으로 찾기" aria-label="앱 검색">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>찾는 앱이 없어요 🥲</p>
</main>

<footer>made by @earth._.uz <a class="admin" href="admin.html" aria-label="관리자 모드" title="관리자 모드">⚙️</a></footer>

<script src="common.js"></script>
<script>
let apps = [];
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");

function render(query) {
  const q = query.trim().toLowerCase();
  const shown = apps.filter(a => (a.title + " " + a.desc).toLowerCase().includes(q));
  grid.replaceChildren(...shown.map(a => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = safeUrl(a.url) || "#";
    card.target = "_blank";
    card.rel = "noopener";

    const img = document.createElement("img");
    img.className = "thumb";
    img.src = thumbSrc(a);
    img.alt = "";
    img.loading = "lazy";

    const body = document.createElement("div");
    body.className = "body";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = a.title;
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = a.desc || "";
    body.append(name, desc);

    card.append(img, body);
    return card;
  }));
  empty.hidden = shown.length > 0;
}

document.getElementById("q").addEventListener("input", e => render(e.target.value));

fetch("links.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => { apps = data; render(""); })
  .catch(() => { empty.textContent = "목록을 불러오지 못했어요. 새로고침해 주세요."; empty.hidden = false; });
</script>
</body>
</html>
